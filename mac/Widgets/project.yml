name: AndromacWidgets
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  AndromacWidgets:
    type: app-extension
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.andromac.mac.widgets
        PRODUCT_NAME: AndromacWidgets
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
